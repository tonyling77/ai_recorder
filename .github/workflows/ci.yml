name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ESP_IDF_REVISION: 7b9cc1ac79f865983f59bb8ff3ff43eb74ff1dbe

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: host tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"

      - name: Check out the pinned ESP-IDF
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: espressif/esp-idf
          ref: ${{ env.ESP_IDF_REVISION }}
          path: .idf/esp-idf
          submodules: recursive
          persist-credentials: false

      - name: Install the ESP-IDF tools
        shell: bash
        run: |
          export IDF_PATH="$GITHUB_WORKSPACE/.idf/esp-idf"
          export IDF_TOOLS_PATH="$RUNNER_TEMP/espressif"
          "$IDF_PATH/install.sh" all
          echo "IDF_PATH=$IDF_PATH" >> "$GITHUB_ENV"
          echo "IDF_TOOLS_PATH=$IDF_TOOLS_PATH" >> "$GITHUB_ENV"

      # The host tests write into a temporary directory and the interface
      # suite compiles a component of the Registry, so the managed components
      # have to be there before the tests run. Resolving them is a
      # configure, not a build. The versions are the ones the manifest pins.
      - name: Resolve the managed components
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py -C . -B build reconfigure

      - name: Run the inbox tests
        working-directory: tools/inbox
        run: python -m unittest discover -v

      - name: Run the interface policy tests
        working-directory: components/app_hello/host_tests
        run: python -m unittest discover -v

      - name: Run the onboarding policy tests
        working-directory: components/app_onboard/host_tests
        run: python -m unittest discover -v

      - name: Run the recorder policy tests
        working-directory: components/app_recorder/host_tests
        run: python -m unittest discover -v

      # Each suite is reported on its own, so a failure names the suite that
      # failed instead of only the exit code of the last command.
      - name: Build and run the host tests
        shell: bash
        run: |
          failed=0
          for dir in components/app_hello/host_tests \
                     components/app_onboard/host_tests \
                     components/app_recorder/host_tests; do
            echo "### $dir" >> "$GITHUB_STEP_SUMMARY"
            if make -C "$dir" test >> "$GITHUB_STEP_SUMMARY" 2>&1; then
              echo "**$dir passed**" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "**$dir FAILED**" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          exit $failed
